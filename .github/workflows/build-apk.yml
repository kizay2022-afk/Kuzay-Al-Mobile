name: Build Kuzay AI Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create . --platforms=android --project-name kuzay_ai
      - name: Apply Kuzay cat icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp android_icon/kuzay_cat.xml android/app/src/main/res/drawable/kuzay_cat.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/kuzay_cat"')
          p.write_text(s)
          PY
      - name: Configure Android permissions
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>' android/app/src/main/AndroidManifest.xml
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Kuzay-AI-Android
          path: build/app/outputs/flutter-apk/app-release.apk
